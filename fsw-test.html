<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FSW Complete Sign Test</title>
    <link rel="stylesheet" type="text/css" href="src/css/SuttonSignWriting.css" />
    <script src="src/js/SuttonSignWriting.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        
        .test-container {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .sign-display {
            background: white;
            border: 2px solid #333;
            padding: 20px;
            margin: 10px 0;
            display: inline-block;
        }
        
        .fsw-string {
            font-family: monospace;
            background: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
            word-break: break-all;
        }
        
        .debug-info {
            background: #e8f4fd;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #2196F3;
        }
        
        .error {
            background: #ffebee;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #f44336;
            color: #c62828;
        }
        
        .success {
            background: #e8f5e8;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>FSW Complete Sign Test</h1>
    
    <div class="test-container">
        <h2>Input FSW String:</h2>
        <div class="fsw-string">AS20310S26b02S33100M521x547S33100482x483S20310506x500S26b02503x520</div>
    </div>
    
    <div class="test-container">
        <h2>Generated SVG using ssw.svg():</h2>
        <div id="svg-output"></div>
        <div id="svg-debug"></div>
    </div>
    
    <div class="test-container">
        <h2>Raw SVG Code:</h2>
        <pre id="svg-code"></pre>
    </div>
    
    <div class="test-container">
        <h2>Individual Symbols Analysis:</h2>
        <div id="symbol-analysis"></div>
    </div>

    <script>
        const fswString = "AS20310S26b02S33100M521x547S33100482x483S20310506x500S26b02503x520";
        
        function runTest() {
            try {
                // Check if ssw is available
                if (typeof ssw === 'undefined') {
                    document.getElementById('svg-debug').innerHTML = '<div class="error">❌ SSW library not loaded!</div>';
                    return;
                }
                
                document.getElementById('svg-debug').innerHTML = '<div class="success">✅ SSW library loaded successfully</div>';
                
                // Generate SVG using ssw.svg
                console.log('Generating SVG for FSW:', fswString);
                const svgResult = ssw.svg(fswString);
                
                console.log('SVG Result:', svgResult);
                
                // Display the SVG
                document.getElementById('svg-output').innerHTML = svgResult;
                
                // Show the raw SVG code
                document.getElementById('svg-code').textContent = svgResult;
                
                // Analyze the FSW string
                analyzeSymbols(fswString);
                
            } catch (error) {
                console.error('Error generating SVG:', error);
                document.getElementById('svg-debug').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        function analyzeSymbols(fsw) {
            try {
                const analysisDiv = document.getElementById('symbol-analysis');
                let html = '';
                
                // Parse the FSW string manually to extract symbols
                const symbolMatches = fsw.match(/S[0-9a-f]{5}/gi);
                
                if (symbolMatches) {
                    html += `<h3>Found ${symbolMatches.length} symbols:</h3>`;
                    
                    symbolMatches.forEach((symbol, index) => {
                        html += `<div class="debug-info">`;
                        html += `<strong>Symbol ${index + 1}:</strong> ${symbol}<br>`;
                        
                        try {
                            // Try to get individual symbol info
                            const code = ssw.code(symbol);
                            const pua = ssw.pua(symbol);
                            
                            html += `Code (line): ${code} (${String.fromCharCode(parseInt(code, 16))})<br>`;
                            html += `PUA (fill): ${pua} (${String.fromCharCode(parseInt(pua, 16))})<br>`;
                            
                            // Test individual symbol SVG
                            const symbolSvg = ssw.svg(symbol);
                            html += `<div style="margin: 10px 0;">Individual SVG: ${symbolSvg}</div>`;
                            
                        } catch (err) {
                            html += `<span style="color: red;">Error processing symbol: ${err.message}</span><br>`;
                        }
                        
                        html += `</div>`;
                    });
                } else {
                    html += '<div class="error">No symbols found in FSW string</div>';
                }
                
                // Also try to parse coordinates
                const coordMatches = fsw.match(/M\d+x\d+/g);
                if (coordMatches) {
                    html += `<h3>Sign Box: ${coordMatches[0]}</h3>`;
                }
                
                const positionMatches = fsw.match(/S[0-9a-f]{5}\d+x\d+/gi);
                if (positionMatches) {
                    html += `<h3>Symbol Positions:</h3>`;
                    positionMatches.forEach((pos, index) => {
                        html += `<div>${index + 1}. ${pos}</div>`;
                    });
                }
                
                analysisDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Error analyzing symbols:', error);
                document.getElementById('symbol-analysis').innerHTML = `<div class="error">Analysis error: ${error.message}</div>`;
            }
        }
        
        // Run test when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runTest);
        } else {
            runTest();
        }
        
        // Also run after a delay to ensure fonts are loaded
        setTimeout(runTest, 1000);
    </script>
</body>
</html>
