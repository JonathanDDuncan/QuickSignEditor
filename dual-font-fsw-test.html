<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dual-Font FSW Implementation Test</title>
    <link rel="stylesheet" type="text/css" href="src/css/SuttonSignWriting.css" />
    <script src="src/js/SuttonSignWriting.js"></script>
    <script type="module" src="/src/main.ts"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        
        .test-container {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .comparison {
            display: flex;
            gap: 40px;
            margin: 20px 0;
        }
        
        .comparison > div {
            flex: 1;
            text-align: center;
        }
        
        .sign-display {
            background: white;
            border: 2px solid #333;
            padding: 20px;
            margin: 10px auto;
            display: inline-block;
            min-height: 200px;
            min-width: 200px;
        }
        
        .fsw-string {
            font-family: monospace;
            background: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
            word-break: break-all;
            font-size: 12px;
        }
        
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        
        .success { background: #e8f5e8; border-left: 4px solid #4caf50; }
        .error { background: #ffebee; border-left: 4px solid #f44336; }
        .info { background: #e3f2fd; border-left: 4px solid #2196f3; }
        
        .code-block {
            background: #f8f8f8;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        
        button:hover {
            background: #1976d2;
        }
    </style>
</head>
<body>
    <h1>Dual-Font FSW Implementation Test</h1>
    
    <div class="test-container">
        <h2>Test FSW String:</h2>
        <div class="fsw-string">AS20310S26b02S33100M521x547S33100482x483S20310506x500S26b02503x520</div>
        
        <button onclick="runTest()">Run Test</button>
        <button onclick="runComparison()">Compare Implementations</button>
        
        <div id="status"></div>
    </div>
    
    <div class="comparison">        <div>
            <h3>🔥 Official SSW Output</h3>
            <div class="sign-display" id="official-output">
                <div style="color: #666;">Click "Run Test" to generate</div>
            </div>
            <div class="code-block" id="official-code"></div>
        </div>
    </div>
    
    <div class="test-container">
        <h2>Analysis</h2>
        <div id="analysis"></div>
    </div>

    <script type="module">
        const fswString = "AS20310S26b02S33100M521x547S33100482x483S20310506x500S26b02503x520";
          async function runTest() {
            const statusDiv = document.getElementById('status');
            
            try {
                statusDiv.innerHTML = '<div class="info">Testing SSW library...</div>';
                
                // Check SSW library
                if (typeof window.ssw === 'undefined') {
                    statusDiv.innerHTML = '<div class="error">❌ SSW library not loaded!</div>';
                    return;
                }
                
                statusDiv.innerHTML = '<div class="success">✅ SSW library loaded successfully!</div>';
                
                // Generate official output
                const officialSVG = window.ssw.svg(fswString);
                document.getElementById('official-output').innerHTML = officialSVG;
                document.getElementById('official-code').textContent = officialSVG;
                
                // Analyze results
                analyzeResults(officialSVG);
                
            } catch (error) {
                console.error('Test error:', error);
                statusDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
          function analyzeResults(official) {
            const analysisDiv = document.getElementById('analysis');
            
            let analysis = '<h3>Analysis Results:</h3>';
            
            // Size comparison
            analysis += `<p><strong>SVG Length:</strong> ${official.length} characters</p>`;
            
            // Dual-font detection
            const hasFill = official.includes('sym-fill');
            const hasLine = official.includes('sym-line');
            const hasFillFont = official.includes('SuttonSignWritingFill');
            const hasLineFont = official.includes('SuttonSignWritingLine');
            
            analysis += `<p><strong>Official SSW Implementation:</strong></p>`;
            analysis += `<ul>`;
            analysis += `<li>Has fill class: ${hasFill ? '✅ Yes' : '❌ No'}</li>`;
            analysis += `<li>Has line class: ${hasLine ? '✅ Yes' : '❌ No'}</li>`;
            analysis += `<li>Has fill font: ${hasFillFont ? '✅ Yes' : '❌ No'}</li>`;
            analysis += `<li>Has line font: ${hasLineFont ? '✅ Yes' : '❌ No'}</li>`;
            analysis += `<li>Dual-font ready: ${(hasFill && hasLine && hasFillFont && hasLineFont) ? '✅ Yes' : '❌ No'}</li>`;
            analysis += `</ul>`;
            
            // Symbol count
            const symbols = (official.match(/&\#x[0-9a-fA-F]+;|[\uFD00-\uFDFF\uFE00-\uFEFF]/g) || []).length;
            analysis += `<p><strong>Unicode Characters:</strong> ${symbols}</p>`;
            
            // Extract symbols from FSW
            const fswSymbols = fswString.match(/S[123][0-9a-f]{2}[0-5][0-9a-f]/g) || [];
            analysis += `<p><strong>FSW Symbols Found:</strong> ${fswSymbols.length} (${fswSymbols.join(', ')})</p>`;
            
            analysisDiv.innerHTML = analysis;
        }
        
        function runComparison() {
            // Test with multiple FSW strings
            const testStrings = [
                "AS20310S26b02S33100M521x547S33100482x483S20310506x500S26b02503x520",
                "M518x533S1870a489x515S18701482x490S20500508x496S2e734500x468",
                "S10000482x483",
                "S20000500x500"
            ];
            
            console.log('Running comparison with multiple FSW strings...');
            testStrings.forEach((fsw, index) => {
                console.log(`\nTest ${index + 1}: ${fsw}`);
                try {
                    const svg = window.ssw.svg(fsw);
                    console.log(`Official SVG length: ${svg.length}`);
                    console.log(`Contains dual-font classes: ${svg.includes('sym-fill') && svg.includes('sym-line')}`);
                } catch (error) {
                    console.error(`Error with test ${index + 1}:`, error);
                }
            });
        }
        
        // Make functions globally available
        window.runTest = runTest;
        window.runComparison = runComparison;
        
        // Auto-run test after a delay
        setTimeout(() => {
            if (typeof window.ssw !== 'undefined') {
                console.log('SSW library loaded, ready to test');
            }
        }, 1000);
    </script>
</body>
</html>
